name: Build and Deploy to EC2

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write   # OIDC ke liye zaroori

jobs:
  # ─────────────────────────────────────────────
  # JOB A: Security Check — deploy se pehle chalta hai
  # ─────────────────────────────────────────────
  security-check:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner - restrict outbound network
        uses: step-security/harden-runner@v2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.githubusercontent.com:443
            registry.npmjs.org:443
            *.amazonaws.com:443
            token.actions.githubusercontent.com:443

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan workflows for malicious exfiltration patterns
        run: |
          echo "Scanning .github/workflows/ for suspicious patterns..."
          FOUND=0

          if grep -rE "curl.*-[a-zA-Z]*d[a-zA-Z]*\s.*secrets\." .github/workflows/ 2>/dev/null; then
            echo "::error::Secret exfiltration pattern detected (curl + secrets)"
            FOUND=1
          fi
          if grep -rE "wget.*secrets\." .github/workflows/ 2>/dev/null; then
            echo "::error::Secret exfiltration pattern detected (wget + secrets)"
            FOUND=1
          fi
          if grep -rE "https?://[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}" .github/workflows/ 2>/dev/null; then
            echo "::error::Raw IP address reference detected in workflow"
            FOUND=1
          fi
          if grep -rE "base64\s+(-d|--decode).*\|\s*(sh|bash)" .github/workflows/ 2>/dev/null; then
            echo "::error::Obfuscated command execution detected"
            FOUND=1
          fi

          if [ "$FOUND" -eq 1 ]; then
            echo "::error::Malicious pattern found — blocking pipeline"
            exit 1
          fi

          echo "Security scan passed — no suspicious patterns found"

  # ─────────────────────────────────────────────
  # JOB B: Build (early check) + Deploy — sirf security-check pass hone par
  # ─────────────────────────────────────────────
  deploy:
    needs: security-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner - restrict outbound network
        uses: step-security/harden-runner@v2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.githubusercontent.com:443
            registry.npmjs.org:443
            *.amazonaws.com:443
            token.actions.githubusercontent.com:443

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (early failure check)
        run: npm run build

      - name: Verify build folder
        run: |
          if [ ! -d "build" ] || [ -z "$(ls -A build)" ]; then
            echo "Build folder empty or missing!"
            exit 1
          fi

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-2

      - name: Deploy on server via SSM (clone/pull + build + atomic swap + reload nginx)
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.AWS_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Xammer.com deploy from GitHub Actions" \
            --parameters 'commands=[
              "export HOME=/root",
              "set -e",
              "SRC_DIR=/home/ec2-user/xammer-source",
              "if [ ! -d \"$SRC_DIR/.git\" ]; then git clone git@github.com:XamOps/Xammer.com.git \"$SRC_DIR\"; fi",
              "git config --global --add safe.directory $SRC_DIR",
              "cd $SRC_DIR",
              "git fetch origin main",
              "git reset --hard origin/main",
              "npm ci",
              "npm run build",
              "if [ ! -d \"$SRC_DIR/build\" ] || [ -z \"$(ls -A $SRC_DIR/build)\" ]; then echo Build folder empty or missing on server; exit 1; fi",
              "FILES=$(grep -rl xammer /etc/nginx 2>/dev/null || true)",
              "if [ -n \"$FILES\" ]; then for f in $FILES; do if grep -qE \"try_files[[:space:]]+\\$uri[[:space:]]+/index\\.html;\" \"$f\"; then cp \"$f\" \"$f.bak.$(date +%Y%m%d%H%M%S)\"; sed -i -E \"s#try_files[[:space:]]+\\$uri[[:space:]]+/index\\.html;#try_files \\$uri \\$uri/ \\$uri/index.html /index.html;#\" \"$f\"; fi; done; fi",
              "nginx -t",
              "rm -rf /home/ec2-user/xammer.in/build_backup",
              "if [ -d /home/ec2-user/xammer.in/build ]; then mv /home/ec2-user/xammer.in/build /home/ec2-user/xammer.in/build_backup; fi",
              "cp -r $SRC_DIR/build /home/ec2-user/xammer.in/build",
              "systemctl reload nginx",
              "echo Deployed at: $(date) > /home/ec2-user/xammer.in/deploy.log",
              "echo Commit: $(cd $SRC_DIR && git rev-parse HEAD) >> /home/ec2-user/xammer.in/deploy.log",
              "echo Deployment successful"
            ]' \
            --query "Command.CommandId" --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.AWS_INSTANCE_ID }}" || true

      - name: Show deployment output
        run: |
          echo "Using Command ID: $COMMAND_ID"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.AWS_INSTANCE_ID }}" \
            --query "Status" --output text)
          echo "Command Status: $STATUS"

          echo "----- STDOUT -----"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.AWS_INSTANCE_ID }}" \
            --query "StandardOutputContent" --output text

          echo "----- STDERR -----"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.AWS_INSTANCE_ID }}" \
            --query "StandardErrorContent" --output text

          if [ "$STATUS" != "Success" ]; then
            echo "::error::Deployment command did not succeed (status: $STATUS)"
            exit 1
          fi
