name: Build and Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Fix nginx try_files to serve per-route static HTML
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            FILES=$(sudo grep -rl "xammer" /etc/nginx 2>/dev/null || true)
            if [ -z "$FILES" ]; then
              echo "No nginx config file mentioning 'xammer' found under /etc/nginx. Skipping."
              exit 0
            fi

            CHANGED=0
            for f in $FILES; do
              if sudo grep -qE 'try_files[[:space:]]+\$uri[[:space:]]+/index\.html;' "$f"; then
                echo "Patching try_files in $f"
                sudo cp "$f" "$f.bak.$(date +%Y%m%d%H%M%S)"
                sudo sed -i -E 's#try_files[[:space:]]+\$uri[[:space:]]+/index\.html;#try_files $uri $uri/ $uri/index.html /index.html;#' "$f"
                CHANGED=1
              fi
            done

            if [ "$CHANGED" -eq 0 ]; then
              echo "No 'try_files \$uri /index.html;' pattern found — no change made. Current try_files lines:"
              sudo nginx -T 2>&1 | grep -B2 -A2 try_files || true
              exit 0
            fi

            echo "=== Validating nginx config ==="
            if sudo nginx -t; then
              echo "Config valid, reloading nginx"
              sudo systemctl reload nginx
              echo "nginx try_files patched and reloaded successfully."
            else
              echo "nginx -t FAILED — rolling back changed files"
              for f in $FILES; do
                LATEST_BAK=$(ls -t "$f".bak.* 2>/dev/null | head -1 || true)
                if [ -n "$LATEST_BAK" ]; then
                  sudo cp "$LATEST_BAK" "$f"
                  echo "Restored $f from $LATEST_BAK"
                fi
              done
              sudo nginx -t
              exit 1
            fi

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

      - name: Verify build folder
        run: |
          if [ ! -d "build" ] || [ -z "$(ls -A build)" ]; then
            echo "Build folder empty or missing!"
            exit 1
          fi

      - name: Prepare build_new directory on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            rm -rf /home/ec2-user/xammer.in/build_new
            mkdir -p /home/ec2-user/xammer.in/build_new

      - name: Deploy build to EC2 via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: build/
          remote_path: /home/ec2-user/xammer.in/build_new/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_KEY }}

      - name: Atomic swap, backup & reload nginx on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            # Remove old backup and backup current build
            rm -rf /home/ec2-user/xammer.in/build_backup
            if [ -d /home/ec2-user/xammer.in/build ]; then
              mv /home/ec2-user/xammer.in/build /home/ec2-user/xammer.in/build_backup
            fi

            # Atomic swap
            mv /home/ec2-user/xammer.in/build_new /home/ec2-user/xammer.in/build

            # Reload nginx with auto rollback if it fails
            if ! sudo systemctl reload nginx; then
              echo "Nginx reload failed! Rolling back..."
              mv /home/ec2-user/xammer.in/build /home/ec2-user/xammer.in/build_new
              mv /home/ec2-user/xammer.in/build_backup /home/ec2-user/xammer.in/build
              sudo systemctl reload nginx
              exit 1
            fi

            # Save deploy info
            echo "Deployed at: $(date)"                        > /home/ec2-user/xammer.in/deploy.log
            echo "Commit: ${{ github.sha }}"                  >> /home/ec2-user/xammer.in/deploy.log
            echo "Branch: ${{ github.ref_name }}"             >> /home/ec2-user/xammer.in/deploy.log
            echo "By: ${{ github.actor }}"                    >> /home/ec2-user/xammer.in/deploy.log

            echo "Deployment successful!"
