name: Secrets Exfiltration Guard

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan workflows and package scripts for exfiltration patterns
        run: |
          set -e
          FAIL=0

          # Files that are allowed to legitimately reference secrets (our own deploy workflow).
          ALLOWLIST="./.github/workflows/deploy.yml"

          TARGETS=$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) ! -name 'secrets-guard.yml' 2>/dev/null)
          TARGETS="$TARGETS package.json"

          for f in $TARGETS; do
            [ -f "$f" ] || continue

            allowed=0
            for a in $ALLOWLIST; do
              [ "$f" = "$a" ] && allowed=1
            done

            # secrets.* sent off-host via curl/wget/nc, outside the allowlisted deploy workflow.
            if [ "$allowed" -eq 0 ] && grep -nE '(curl|wget|nc[[:space:]]).*secrets\.' "$f" >/dev/null 2>&1; then
              echo "::error file=$f::Found a secrets.* value passed to curl/wget/nc — looks like credential exfiltration."
              grep -nE '(curl|wget|nc[[:space:]]).*secrets\.' "$f"
              FAIL=1
            fi

            # curl/wget output piped straight into a shell.
            if grep -nE '(curl|wget)[^|]*\|[[:space:]]*(sh|bash)' "$f" >/dev/null 2>&1; then
              echo "::error file=$f::Found curl/wget piped directly into a shell."
              grep -nE '(curl|wget)[^|]*\|[[:space:]]*(sh|bash)' "$f"
              FAIL=1
            fi

            # Download-then-execute of a remote binary (download, chmod +x, run).
            if grep -nE '(curl|wget)[^&\n]*(-o|-O)[^&\n]*&&[^&\n]*chmod[[:space:]]+\+x' "$f" >/dev/null 2>&1; then
              echo "::error file=$f::Found a download-then-chmod+x-then-execute pattern for a remote binary."
              grep -nE '(curl|wget)[^&\n]*(-o|-O)[^&\n]*&&[^&\n]*chmod[[:space:]]+\+x' "$f"
              FAIL=1
            fi

            # Bare IP-address URLs (legitimate remote calls should go through named hosts).
            if grep -nE 'https?://[0-9]{1,3}(\.[0-9]{1,3}){3}' "$f" >/dev/null 2>&1; then
              echo "::error file=$f::Found a bare IP-address URL — verify this is expected."
              grep -nE 'https?://[0-9]{1,3}(\.[0-9]{1,3}){3}' "$f"
              FAIL=1
            fi
          done

          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "Secrets exfiltration guard failed. If this is a false positive, add the file to ALLOWLIST in this workflow after manual review."
            exit 1
          fi

          echo "No exfiltration patterns found."
